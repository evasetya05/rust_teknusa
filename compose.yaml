services:
  db:
    image: postgres:16-alpine
    container_name: teknusa_rust_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teknusas_teknusa
      POSTGRES_USER: teknusas_teknusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-@Pontianak123}}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teknusa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teknusas_teknusa -d teknusas_teknusa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: teknusa_rust_ollama
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - teknusa_network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  teknusa_network:
    driver: bridge
