{% extends "dashboard_layout.html" %}
{% block title %}Lead Follow-up Calendar{% endblock %}

{% block page_css %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
<style>
  .calendar-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .fc-event { cursor: pointer; padding: 2px 4px; font-size: 0.85em; }
</style>
{% endblock %}

{% block main_content %}
<div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
  <h1 class="h2 mb-0">Follow-up Calendar</h1>
  <a href="/leads/" class="btn btn-sm btn-outline-secondary"><i class="fas fa-list me-1"></i> Kembali ke Daftar</a>
</div>
<div class="calendar-container">
  <div id="calendar"></div>
</div>
{% endblock %}

{% block page_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');
  var isMobile = window.innerWidth < 768;
  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: isMobile ? 'listWeek' : 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: isMobile ? 'listWeek' : 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    events: '/leads/calendar/events/',
    eventClick: function(info) {
      if (info.event.url) {
        window.location.href = info.event.url;
        return false;
      }
    },
    height: 'auto',
    dayMaxEvents: true,
    navLinks: true,
    eventDisplay: 'block'
  });
  calendar.render();
});
</script>
{% endblock %}
