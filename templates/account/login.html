{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm" style="border-radius: 16px;">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
            <i class="fas fa-lock fa-lg"></i>
          </div>
          <h1 class="h4 fw-bold mb-1">Teknusa ERP</h1>
          <p class="text-muted small mb-0">Masuk untuk melanjutkan ke dashboard</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login/">
          <input type="hidden" name="next" value="{{ next | default(value='/dashboard/') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="id_username">Username</label>
            <input type="text" id="id_username" name="username" class="form-control" value="{{ username | default(value='') }}" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold" for="id_password">Password</label>
            <input type="password" id="id_password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
            <i class="fas fa-sign-in-alt me-1"></i> Login
          </button>
        </form>

        <div class="text-center mt-3 small text-muted">
          Belum punya akun? <a href="/register/" class="text-decoration-none fw-semibold">Register</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
