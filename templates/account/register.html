{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm" style="border-radius: 16px;">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="h4 fw-bold mb-1">Buat Akun Teknusa ERP</h1>
          <p class="text-muted small mb-0">Daftarkan akun baru untuk mengakses modul ERP</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register/">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="reg_username">Username</label>
            <input type="text" id="reg_username" name="username" class="form-control" value="{{ username | default(value='') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="reg_email">Email</label>
            <input type="email" id="reg_email" name="email" class="form-control" value="{{ email | default(value='') }}" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-semibold" for="reg_first">First Name</label>
              <input type="text" id="reg_first" name="first_name" class="form-control" value="{{ first_name | default(value='') }}">
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold" for="reg_last">Last Name</label>
              <input type="text" id="reg_last" name="last_name" class="form-control" value="{{ last_name | default(value='') }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="reg_pw1">Password</label>
            <input type="password" id="reg_pw1" name="password1" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold" for="reg_pw2">Konfirmasi Password</label>
            <input type="password" id="reg_pw2" name="password2" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
            <i class="fas fa-user-plus me-1"></i> Register
          </button>
        </form>

        <div class="text-center mt-3 small text-muted">
          Sudah punya akun? <a href="/login/" class="text-decoration-none fw-semibold">Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
