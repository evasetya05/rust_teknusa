{% extends "dashboard_layout.html" %}
{% block title %}Lampiran Task{% endblock %}
{% block main_content %}
<div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
  <h1 class="h4 mb-0">Lampiran Task #{{ task_id }}</h1>
  <a href="/kanban/task/{{ task_id }}/edit/" class="btn btn-outline-secondary btn-sm">← Kembali ke Task</a>
</div>
<div class="card border-0 shadow-sm p-4">
  <form method="post" enctype="multipart/form-data" class="mb-4">
    <div class="input-group">
      <input type="file" name="file" class="form-control" required>
      <button type="submit" class="btn btn-success">Upload</button>
    </div>
  </form>
  {% for a in attachments %}
  <div class="p-2 mb-2 bg-light rounded border small d-flex justify-content-between">
    <a href="{{ a.file_url }}" target="_blank">{{ a.file_name }}</a>
    <span class="text-muted">{{ a.uploaded_at }}</span>
  </div>
  {% endfor %}
</div>
{% endblock %}
