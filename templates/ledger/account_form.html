{% extends "dashboard_layout.html" %}
{% block title %}Buat Akun Baru - Ledger{% endblock %}

{% block main_content %}
<div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
  <h1 class="h3 mb-0">Buat Akun Baru</h1>
  <a href="/ledger/accounts/accounts/" class="btn btn-outline-secondary btn-sm">← Kembali ke Daftar Akun</a>
</div>

<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label small fw-bold">Perusahaan (Entity)</label>
            <select name="entity" class="form-select">
              <option value="">-- Global --</option>
              {% for ent in entities %}
              <option value="{{ ent.id }}" {% if default_entity_id == ent.id %}selected{% endif %}>{{ ent.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Tipe Akun *</label>
            <select name="account_type" class="form-select" required>
              {% for t in account_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Nama Akun *</label>
            <input type="text" name="account_name" class="form-control" placeholder="Contoh: 1010: Cash" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Kode / CoA</label>
            <input type="text" name="coa" class="form-control" value="Default CoA">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Balance Type *</label>
            <select name="balance_type" class="form-select" required>
              {% for b in balance_types %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">CoA Role Default</label>
            <input type="text" name="coa_role_default" class="form-control">
          </div>
          <div class="d-flex gap-4 mb-4">
            <div class="form-check"><input type="checkbox" class="form-check-input" id="id_act" name="active" checked><label class="form-check-label" for="id_act">Active</label></div>
            <div class="form-check"><input type="checkbox" class="form-check-input" id="id_lock" name="locked"><label class="form-check-label" for="id_lock">Locked</label></div>
          </div>
          <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Simpan Akun</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
